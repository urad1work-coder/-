<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 240px; padding: 16px; font-family: system-ui, sans-serif; background: #0f0f13; color: #e8e6f0; }
  .header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .logo { width: 24px; height: 24px; border-radius: 6px; background: #7c5af0; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .title { font-size: 13px; font-weight: 700; color: #7c5af0; }
  .conn-status { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: #1a1a22; border-radius: 6px; margin-bottom: 10px; font-size: 11px; color: #888; }
  .conn-dot { width: 6px; height: 6px; border-radius: 50%; background: #555; flex-shrink: 0; }
  .conn-dot.ok { background: #4ade80; }
  .conn-dot.err { background: #f87171; }
  .track { background: #1a1a22; border: 1px solid #2a2a38; border-radius: 8px; padding: 10px 12px; }
  .track-source { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: #7c5af0; margin-bottom: 4px; }
  .track-song { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-artist { font-size: 11px; color: #666; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { font-size: 12px; color: #444; text-align: center; padding: 12px 0; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">♪</div>
  <div class="title">NowPlaying Helper</div>
</div>
<div class="conn-status">
  <div class="conn-dot" id="connDot"></div>
  <span id="connText">連線中…</span>
</div>
<div id="trackWrap"></div>
<script src="popup.js"></script>
</body>
</html>
